server:
  port: 8080

spring:
  application:
    name: guli
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

guli:
  jwt:
    secret: ${JWT_SECRET:guli-dev-only-placeholder-change-in-production}
    expire-minutes: 720
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucket: gulia1
    url-prefix: https://gulia1.oss-cn-beijing.aliyuncs.com
    access-key-id: ""
    access-key-secret: ""

logging:
  level:
    com.guli: debug
