<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
</head>
<body>
<div class="canvas">
  <div class="fig-head">
    <div>
      <span class="no">FIG. 07</span>
      <h1>部署图</h1>
    </div>
    <p class="note">
      单台云服务器承载全部后端组件：Nginx 托管两个前端产物并反向代理，Spring Boot 以 systemd 常驻，MySQL 同机直连。<br>
      只有图片走阿里云 OSS，其余第三方能力（短信、支付、视频点播）均未接入。
    </p>
  </div>

  <svg viewBox="0 140 1448 512" width="1448" height="512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="net" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
        <path d="M0,0 L10,5 L0,10 z" fill="#6f7a70"/>
      </marker>
      <style>
        .node { fill: #ffffff; stroke: #a8a294; stroke-width: 1.2; }
        .node-hi { fill: #f2f6f3; stroke: #123a2c; stroke-width: 1.5; }
        .node-ext { fill: #fdf7ea; stroke: #b5761a; stroke-width: 1.3; }
        .nm { font-family: 'Serif SC', serif; font-size: 14px; fill: #17201a; }
        .st { font-size: 10px; fill: #b5761a; letter-spacing: 0.1em; }
        .de { font-size: 11px; fill: #6f7a70; }
        .ln { stroke: #6f7a70; stroke-width: 1.2; fill: none; }
        .lb { font-size: 11px; fill: #3c463d; font-family: Consolas, monospace; }
      </style>
    </defs>

    <!-- ============ 连线 ============ -->
    <g>
      <line x1="264" y1="300" x2="326" y2="300" class="ln" marker-end="url(#net)"/>
      <line x1="512" y1="300" x2="556" y2="300" class="ln" marker-end="url(#net)"/>
      <line x1="784" y1="300" x2="816" y2="300" class="ln" marker-end="url(#net)"/>
      <path d="M672,330 L672,520 L874,520" class="ln" marker-end="url(#net)"/>
    </g>

    <text x="296" y="326" text-anchor="middle" class="lb">HTTPS</text>
    <text x="534" y="276" text-anchor="middle" class="lb">proxy</text>
    <text x="800" y="276" text-anchor="middle" class="lb">JDBC</text>
    <text x="690" y="460" class="lb">HTTPS · 图片上传 / 回源</text>

    <!-- ============ 浏览器 ============ -->
    <rect x="60" y="245" width="204" height="110" rx="3" class="node"/>
    <text x="76" y="268" class="st">«device»</text>
    <text x="76" y="292" class="nm">客户端浏览器</text>
    <text x="76" y="314" class="de">Chrome / Edge</text>
    <text x="76" y="334" class="de">前台 :80　后台 :80/admin-ui/</text>

    <!-- ============ 服务器边界 ============ -->
    <rect x="300" y="150" width="800" height="290" fill="#f7faf8" stroke="#123a2c" stroke-width="1.4" stroke-dasharray="8 5"/>
    <text x="318" y="176" class="st">«device» 云服务器 122.51.6.69</text>
    <text x="318" y="196" class="de">Ubuntu 24.04 · 4C 4G · 40G</text>

    <!-- Nginx -->
    <rect x="326" y="245" width="186" height="110" rx="3" class="node-hi"/>
    <text x="342" y="268" class="st">«运行环境»</text>
    <text x="342" y="292" class="nm">Nginx</text>
    <text x="342" y="314" class="de">:80 / :443</text>
    <text x="342" y="334" class="de">静态托管 + 反向代理</text>

    <!-- Spring Boot -->
    <rect x="556" y="245" width="228" height="110" rx="3" class="node-hi"/>
    <text x="572" y="268" class="st">«运行环境»</text>
    <text x="572" y="292" class="nm">Spring Boot 4.1.1</text>
    <text x="572" y="314" class="de">:8080 · systemd 常驻</text>
    <text x="572" y="334" class="de">jar：guli-1.0.jar（JDK 21）</text>

    <!-- MySQL -->
    <rect x="816" y="245" width="186" height="110" rx="3" class="node-hi"/>
    <text x="832" y="268" class="st">«运行环境»</text>
    <text x="832" y="292" class="nm">MySQL 8.0</text>
    <text x="832" y="314" class="de">:3306 · 仅本机可连</text>
    <text x="832" y="334" class="de">库 guli（10 张表）</text>

    <!-- ============ OSS ============ -->
    <rect x="874" y="466" width="300" height="104" rx="3" class="node-ext"/>
    <text x="890" y="489" class="st">«external service»</text>
    <text x="890" y="513" class="nm">阿里云 OSS</text>
    <text x="890" y="535" class="de">Bucket：gulia1 · 华北（北京）</text>
    <text x="890" y="555" class="de">仅存图片：avatar / cover / banner</text>

    <!-- ============ 说明 ============ -->
    <text x="60" y="600" class="de">部署步骤：① 服务器装 JDK 21 与 MySQL；② 前端 npm run build 后由 Nginx 指向 dist；③ 后端 jar 注册 systemd 服务；④ Nginx 把 /api、/admin 反代到 127.0.0.1:8080。</text>
    <text x="60" y="624" class="de">安全：MySQL 3306 只监听 127.0.0.1；JWT 密钥与数据库口令写在服务器本地 application-local.yml，不入库不入仓。</text>
  </svg>

  <div class="legend">
    <span>«device» = 物理/虚拟设备</span>
    <span>«运行环境» = 执行环境</span>
    <span>«external service» = 外部服务（仅图片）</span>
  </div>
</div>
</body>
</html>
