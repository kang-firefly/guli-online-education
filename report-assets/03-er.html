<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">

<body>
<div class="canvas">
  <div class="fig-head">
    <div>
      <span class="no">FIG. 03</span>
      <h1>E-R 图（实体—联系）</h1>
    </div>
    <p class="note">
      核心链路：讲师 1—N 课程，课程 1—1 简介、1—N 章节、1—N 小节；分类自关联成两级。<br>
      右侧四张为独立实体，不参与课程聚合。
    </p>
  </div>

  <svg viewBox="0 150 1448 1060" width="1448" height="1060" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="foot" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
        <path d="M1,6 L11,1 M1,6 L11,11 M1,6 L11,6" stroke="#6f7a70" stroke-width="1.1"/>
      </marker>
      <marker id="one" markerWidth="12" markerHeight="12" refX="1" refY="6" orient="auto">
        <path d="M6,1 L6,11" stroke="#6f7a70" stroke-width="1.4"/>
      </marker>
      <style>
        .hdr { fill: #f2f6f3; }
        .box { fill: #ffffff; stroke: #a8a294; stroke-width: 1.1; }
        .pk { fill: #fdf7ea; }
        .fk { fill: #b5761a; }
        .tbl { font-family: Consolas, monospace; font-size: 12.5px; fill: #17201a; }
        .fld { font-family: Consolas, monospace; font-size: 11px; fill: #3c463d; }
        .cmt { font-size: 10.5px; fill: #6f7a70; }
        .tag { font-family: Consolas, monospace; font-size: 9px; fill: #b5761a; }
        .rel { font-size: 11px; fill: #6f7a70; }
      </style>
    </defs>

      <text x="52" y="278" class="fld">name</text><text x="328" y="278" text-anchor="end" class="cmt">姓名</text>

      <text x="52" y="388" class="fld">sort</text><text x="328" y="388" text-anchor="end" class="cmt">排序</text>
      <text x="52" y="410" class="fld">gmt_create</text><text x="328" y="410" text-anchor="end" class="cmt">创建时间</text>
      <text x="52" y="432" class="fld">is_deleted</text><text x="328" y="432" text-anchor="end" class="cmt">逻辑删除</text>
    </g>

    <g>

      <rect class="hdr" x="820" y="780" width="300" height="34"/>

    <!-- ==================== 关系连线 ==================== -->
    <g stroke="#6f7a70" stroke-width="1.1">
      <!-- 讲师 1 — N 课程 -->
      <path d="M340,316 L430,316" marker-start="url(#one)" marker-end="url(#foot)"/>
      <!-- 分类 1 — N 课程 -->
      <path d="M820,300 L730,300" marker-start="url(#one)" marker-end="url(#foot)"/>
      <!-- 课程 1 — 1 简介 -->
      <path d="M580,498 L580,600" marker-start="url(#one)" marker-end="url(#one)"/>
      <!-- 课程 1 — N 章节 -->
      <path d="M730,440 L775,440 L775,650 L820,650" marker-start="url(#one)" marker-end="url(#foot)"/>
      <!-- 章节 1 — N 小节 -->
      <path d="M970,722 L970,780" marker-start="url(#one)" marker-end="url(#foot)"/>

    <!-- 分类自关联 -->
    <path d="M1120,250 L1176,250 L1176,172 L1058,172 L1058,200" stroke="#6f7a70" stroke-width="1.1"
