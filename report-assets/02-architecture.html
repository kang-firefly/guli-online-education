<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
</head>
<body>
<div class="canvas">
  <div class="fig-head">
    <div>
      <span class="no">FIG. 02</span>
      <h1>平台体系结构图</h1>
    </div>
    <p class="note">
      单体分层架构（Spring Boot 4.1.1 + JDK 21）。<br>
      上层只依赖下层的接口，Controller 不直接接触 Mapper，跨层调用由 Service 编排。
    </p>
  </div>

  <svg viewBox="0 0 1448 884" width="1448" height="884" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="down" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto">
        <path d="M0,0 L5,9 L10,0" fill="none" stroke="#6f7a70" stroke-width="1.3"/>
      </marker>
    </defs>

    <!-- ================= 客户端层 ================= -->
    <rect x="110" y="18" width="1220" height="112" stroke="#cfc9ba" stroke-width="1.2" fill="#ffffff"/>
    <text x="126" y="40" class="t-label">客户端层 · CLIENT</text>

    <rect x="180" y="56" width="480" height="54" fill="#f2f6f3" stroke="#1c5240" stroke-width="1.2"/>
    <text x="420" y="78" text-anchor="middle" class="t-title">后台管理端 SPA</text>
    <text x="420" y="97" text-anchor="middle" class="t-small">Vue 3 · Element Plus · vue-router · Vite</text>

    <rect x="760" y="56" width="480" height="54" fill="#f2f6f3" stroke="#1c5240" stroke-width="1.2"/>
    <text x="1000" y="78" text-anchor="middle" class="t-title">前台门户 SPA</text>
    <text x="1000" y="97" text-anchor="middle" class="t-small">Vue 3 · vue-router · Vite（轻量，不用 SSR）</text>

    <line x1="720" y1="130" x2="720" y2="156" stroke="#6f7a70" stroke-width="1.3" marker-end="url(#down)"/>

    <!-- ================= 接入层 ================= -->
    <rect x="110" y="160" width="1220" height="80" stroke="#cfc9ba" stroke-width="1.2" fill="#ffffff"/>
    <text x="126" y="182" class="t-label">接入层 · GATEWAY</text>

    <rect x="470" y="192" width="520" height="40" fill="#fdf7ea" stroke="#b5761a" stroke-width="1.2"/>
    <text x="730" y="217" text-anchor="middle" class="t-body">
       Nginx :80　静态托管　·　/api、/admin 反向代理　·　JWT 透传
    </text>

    <line x1="720" y1="240" x2="720" y2="266" stroke="#6f7a70" stroke-width="1.3" marker-end="url(#down)"/>

    <!-- ================= 应用层 ================= -->
    <rect x="110" y="270" width="1220" height="430" stroke="#123a2c" stroke-width="1.6" fill="#f7faf8"/>
    <text x="126" y="292" class="t-label">应用层 · SPRING BOOT 4.1.1 单体应用（JDK 21）</text>

    <!-- Web 层 -->
    <rect x="130" y="306" width="1180" height="78" fill="#ffffff" stroke="#cfc9ba" stroke-width="1"/>
    <text x="142" y="324" class="t-small">Web 层</text>
    <g>
      <rect x="144" y="332" width="214" height="38" fill="#ffffff" stroke="#123a2c" stroke-width="1"/>
      <text x="251" y="356" text-anchor="middle" class="t-body">Controller（Admin / Portal）</text>

      <rect x="370" y="332" width="112" height="38" fill="#ffffff" stroke="#123a2c" stroke-width="1"/>
      <text x="426" y="356" text-anchor="middle" class="t-body">JWT 拦截器</text>

      <rect x="494" y="332" width="136" height="38" fill="#ffffff" stroke="#123a2c" stroke-width="1"/>
      <text x="562" y="356" text-anchor="middle" class="t-body">统一返回 Result</text>

      <rect x="642" y="332" width="132" height="38" fill="#ffffff" stroke="#123a2c" stroke-width="1"/>
      <text x="708" y="356" text-anchor="middle" class="t-body">全局异常处理器</text>

      <rect x="786" y="332" width="126" height="38" fill="#ffffff" stroke="#123a2c" stroke-width="1"/>
      <text x="849" y="356" text-anchor="middle" class="t-body">参数校验 @Valid</text>

      <rect x="924" y="332" width="118" height="38" fill="#ffffff" stroke="#123a2c" stroke-width="1"/>
      <text x="983" y="356" text-anchor="middle" class="t-body">OpenAPI 文档</text>
    </g>

    <!-- 业务层 -->
    <rect x="130" y="396" width="1180" height="78" fill="#ffffff" stroke="#cfc9ba" stroke-width="1"/>
    <text x="142" y="414" class="t-small">业务层（Service 接口 + Impl）</text>
    <g>
      <rect x="144" y="422" width="118" height="38" fill="#ffffff" stroke="#1c5240" stroke-width="1"/>
      <text x="203" y="446" text-anchor="middle" class="t-body">SystemService</text>

      <rect x="274" y="422" width="124" height="38" fill="#ffffff" stroke="#1c5240" stroke-width="1"/>
      <text x="336" y="446" text-anchor="middle" class="t-body">TeacherService</text>

      <rect x="410" y="422" width="124" height="38" fill="#ffffff" stroke="#1c5240" stroke-width="1"/>
      <text x="472" y="446" text-anchor="middle" class="t-body">SubjectService</text>

      <rect x="546" y="422" width="118" height="38" fill="#ffffff" stroke="#1c5240" stroke-width="1"/>
      <text x="605" y="446" text-anchor="middle" class="t-body">CourseService</text>

      <rect x="676" y="422" width="124" height="38" fill="#ffffff" stroke="#1c5240" stroke-width="1"/>
      <text x="738" y="446" text-anchor="middle" class="t-body">ChapterService</text>

      <rect x="812" y="422" width="124" height="38" fill="#ffffff" stroke="#1c5240" stroke-width="1"/>
      <text x="874" y="446" text-anchor="middle" class="t-body">SectionService</text>

      <rect x="948" y="422" width="112" height="38" fill="#ffffff" stroke="#1c5240" stroke-width="1"/>
      <text x="1004" y="446" text-anchor="middle" class="t-body">IndexService</text>

      <rect x="1072" y="422" width="122" height="38" fill="#ffffff" stroke="#1c5240" stroke-width="1"/>
      <text x="1133" y="446" text-anchor="middle" class="t-body">MemberService</text>
    </g>

    <!-- 持久层 -->
    <rect x="130" y="486" width="1180" height="78" fill="#ffffff" stroke="#cfc9ba" stroke-width="1"/>
    <text x="142" y="504" class="t-small">持久层</text>
    <g>
      <rect x="144" y="512" width="208" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="248" y="536" text-anchor="middle" class="t-body">MyBatis-Plus BaseMapper</text>

      <rect x="364" y="512" width="160" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="444" y="536" text-anchor="middle" class="t-body">分页插件</text>

      <rect x="536" y="512" width="170" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="621" y="536" text-anchor="middle" class="t-body">逻辑删除 is_deleted</text>

      <rect x="718" y="512" width="178" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="807" y="536" text-anchor="middle" class="t-body">自动填充 gmt_create</text>

      <rect x="908" y="512" width="200" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="1008" y="536" text-anchor="middle" class="t-body">实体 Entity（10 张表）</text>
    </g>

    <!-- 基础设施 -->
    <rect x="130" y="576" width="1180" height="78" fill="#ffffff" stroke="#cfc9ba" stroke-width="1"/>
    <text x="142" y="594" class="t-small">基础设施（config / util / common）</text>
    <g>
      <rect x="144" y="602" width="92" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="190" y="626" text-anchor="middle" class="t-body">JwtUtil</text>

      <rect x="248" y="602" width="88" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="292" y="626" text-anchor="middle" class="t-body">OssUtil</text>

      <rect x="348" y="602" width="74" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="385" y="626" text-anchor="middle" class="t-body">IpUtil</text>

      <rect x="434" y="602" width="132" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="500" y="626" text-anchor="middle" class="t-body">JwtProperties</text>

      <rect x="578" y="602" width="200" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="678" y="626" text-anchor="middle" class="t-body">WebConfig（跨域 · 拦截）</text>

      <rect x="790" y="602" width="140" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="860" y="626" text-anchor="middle" class="t-body">PasswordConfig</text>

      <rect x="942" y="602" width="160" height="38" fill="#ffffff" stroke="#a8a294" stroke-width="1"/>
      <text x="1022" y="626" text-anchor="middle" class="t-body">BusinessException</text>
    </g>

    <text x="126" y="682" class="t-small">分层约束：Controller 只做参数绑定与返回封装；ServiceImpl 承担业务规则与事务边界；Mapper 仅单表 CRUD。</text>

    <line x1="720" y1="700" x2="720" y2="736" stroke="#6f7a70" stroke-width="1.3" marker-end="url(#down)"/>

    <!-- ================= 数据层 ================= -->
    <rect x="110" y="740" width="1220" height="112" stroke="#cfc9ba" stroke-width="1.2" fill="#ffffff"/>
    <text x="126" y="762" class="t-label">数据层 · DATA</text>

    <rect x="180" y="778" width="580" height="58" fill="#f2f6f3" stroke="#1c5240" stroke-width="1.2"/>
    <text x="470" y="800" text-anchor="middle" class="t-title">MySQL 8.0.46　库 guli</text>
    <text x="470" y="820" text-anchor="middle" class="t-small">讲师 · 分类 · 课程 · 简介 · 章节 · 小节 · 轮播 · 后台账号 · 学员 · 登录日志</text>

    <rect x="830" y="778" width="410" height="58" fill="#fdf7ea" stroke="#b5761a" stroke-width="1.2"/>
    <text x="1035" y="800" text-anchor="middle" class="t-title">阿里云 OSS</text>
    <text x="1035" y="820" text-anchor="middle" class="t-small">图片存储：avatar / cover / banner</text>
  </svg>

  <div class="legend">
    <span>实线框 = 本期实现</span>
    <span>琥珀色 = 第三方依赖（图片存储；视频点播、短信、支付均不接入）</span>
    <span>数据访问全部经由 MyBatis-Plus，SQL 参数化防注入</span>
  </div>
</div>
</body>
</html>
