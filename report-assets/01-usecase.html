<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="_base.css">
</head>
<body>
<div class="canvas">
  <div class="fig-head">
    <div>
      <span class="no">FIG. 01</span>
      <h1>系统用例图</h1>
    </div>
    <p class="note">
      三类参与者：管理员（后台唯一可登录角色）、学员（前台注册用户）、访客（未登录）。<br>
      讲师只是业务数据，不设账号，因此不作为参与者出现在图中。
    </p>
  </div>

  <svg viewBox="0 0 1448 880" width="1448" height="880" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="arw" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
        <path d="M0,0 L9,4.5 L0,9 z" fill="#6f7a70"/>
      </marker>
    </defs>

    <!-- ============ 系统边界 ============ -->
    <rect x="200" y="46" width="540" height="788" rx="4" stroke="#a8a294" stroke-width="1.2" stroke-dasharray="7 5" fill="none"/>
    <text x="216" y="72" class="t-label">系统边界 · 后台管理端 (admin)</text>

    <rect x="810" y="46" width="540" height="788" rx="4" stroke="#a8a294" stroke-width="1.2" stroke-dasharray="7 5" fill="none"/>
    <text x="826" y="72" class="t-label">系统边界 · 前台门户 (portal)</text>

    <!-- ============ 连线（先画，压在图形下方） ============ -->
    <g stroke="#6f7a70" stroke-width="1.1">
      <!-- 管理员 → 后台用例 -->
      <line x1="112" y1="452" x2="318" y2="160" marker-end="url(#arw)"/>
      <line x1="112" y1="452" x2="318" y2="278" marker-end="url(#arw)"/>
      <line x1="112" y1="452" x2="318" y2="396" marker-end="url(#arw)"/>
      <line x1="112" y1="452" x2="318" y2="514" marker-end="url(#arw)"/>
      <line x1="112" y1="452" x2="318" y2="632" marker-end="url(#arw)"/>
      <line x1="112" y1="452" x2="318" y2="736" marker-end="url(#arw)"/>

      <!-- 访客 → 前台用例（自上而下：浏览类） -->
      <line x1="1396" y1="230" x2="1232" y2="150" marker-end="url(#arw)"/>
      <line x1="1396" y1="230" x2="1232" y2="250" marker-end="url(#arw)"/>
      <line x1="1396" y1="230" x2="1232" y2="350" marker-end="url(#arw)"/>

      <!-- 学员 → 前台用例（浏览 + 注册 + 登录） -->
      <line x1="1396" y1="600" x2="1232" y2="350" marker-end="url(#arw)"/>
      <line x1="1396" y1="600" x2="1232" y2="520" marker-end="url(#arw)"/>
      <line x1="1396" y1="600" x2="1232" y2="630" marker-end="url(#arw)"/>
    </g>

    <!-- ============ 参与者 ============ -->
    <g stroke="#123a2c" stroke-width="1.7" stroke-linecap="round">
      <!-- 管理员 -->
      <g transform="translate(86,452)">
        <circle cx="0" cy="-40" r="14" fill="#ffffff"/>
        <line x1="0" y1="-26" x2="0" y2="6"/>
        <line x1="-21" y1="-14" x2="21" y2="-14"/>
        <line x1="0" y1="6" x2="-17" y2="38"/>
        <line x1="0" y1="6" x2="17" y2="38"/>
      </g>
      <text x="86" y="520" text-anchor="middle" class="t-title">管理员</text>
      <text x="86" y="539" text-anchor="middle" class="t-small">admin</text>

      <!-- 访客 -->
      <g transform="translate(1420,230)">
        <circle cx="0" cy="-40" r="14" fill="#ffffff"/>
        <line x1="0" y1="-26" x2="0" y2="6"/>
        <line x1="-21" y1="-14" x2="21" y2="-14"/>
        <line x1="0" y1="6" x2="-17" y2="38"/>
        <line x1="0" y1="6" x2="17" y2="38"/>
      </g>
      <text x="1420" y="298" text-anchor="middle" class="t-title">访客</text>
      <text x="1420" y="317" text-anchor="middle" class="t-small">guest</text>

      <!-- 学员 -->
      <g transform="translate(1420,600)">
        <circle cx="0" cy="-40" r="14" fill="#ffffff"/>
        <line x1="0" y1="-26" x2="0" y2="6"/>
        <line x1="-21" y1="-14" x2="21" y2="-14"/>
        <line x1="0" y1="6" x2="-17" y2="38"/>
        <line x1="0" y1="6" x2="17" y2="38"/>
      </g>
      <text x="1420" y="668" text-anchor="middle" class="t-title">学员</text>
      <text x="1420" y="687" text-anchor="middle" class="t-small">member</text>
    </g>

    <!-- ============ 后台用例 ============ -->
    <g>
      <g>
        <ellipse cx="470" cy="140" rx="150" ry="34" fill="#ffffff" stroke="#123a2c" stroke-width="1.4"/>
        <text x="470" y="145" text-anchor="middle" class="t-title">登录后台</text>
      </g>
      <g>
        <ellipse cx="470" cy="258" rx="150" ry="42" fill="#ffffff" stroke="#123a2c" stroke-width="1.4"/>
        <text x="470" y="253" text-anchor="middle" class="t-title">讲师管理</text>
        <text x="470" y="272" text-anchor="middle" class="t-small">分页查询 · 增删改 · 头像上传</text>
      </g>
      <g>
        <ellipse cx="470" cy="376" rx="150" ry="42" fill="#ffffff" stroke="#123a2c" stroke-width="1.4"/>
        <text x="470" y="371" text-anchor="middle" class="t-title">课程分类管理</text>
        <text x="470" y="390" text-anchor="middle" class="t-small">两级树 · 增删改 · 引用校验</text>
      </g>
      <g>
        <ellipse cx="470" cy="494" rx="150" ry="42" fill="#ffffff" stroke="#123a2c" stroke-width="1.4"/>
        <text x="470" y="489" text-anchor="middle" class="t-title">课程列表 / 下架 / 删除</text>
        <text x="470" y="508" text-anchor="middle" class="t-small">条件查询 · 状态流转</text>
      </g>
      <g>
        <ellipse cx="470" cy="612" rx="150" ry="42" fill="#ffffff" stroke="#123a2c" stroke-width="1.4"/>
        <text x="470" y="607" text-anchor="middle" class="t-title">维护首页 Banner</text>
        <text x="470" y="626" text-anchor="middle" class="t-small">轮播图增删改 · 排序</text>
      </g>
      <g>
        <ellipse cx="470" cy="740" rx="170" ry="52" fill="#ffffff" stroke="#123a2c" stroke-width="1.6"/>
        <text x="470" y="731" text-anchor="middle" class="t-title">发布课程（三步向导）</text>
        <text x="470" y="750" text-anchor="middle" class="t-small">«include» 大纲管理 · 图片上传</text>
      </g>
    </g>

    <!-- ============ 前台用例 ============ -->
    <g>
      <g>
        <ellipse cx="1080" cy="150" rx="152" ry="42" fill="#ffffff" stroke="#1c5240" stroke-width="1.4"/>
        <text x="1080" y="145" text-anchor="middle" class="t-title">浏览首页</text>
        <text x="1080" y="164" text-anchor="middle" class="t-small">Banner · 热门课程 · 名师</text>
      </g>
      <g>
        <ellipse cx="1080" cy="250" rx="152" ry="42" fill="#ffffff" stroke="#1c5240" stroke-width="1.4"/>
        <text x="1080" y="245" text-anchor="middle" class="t-title">查看讲师列表 / 详情</text>
        <text x="1080" y="264" text-anchor="middle" class="t-small">资料 + 主讲课程</text>
      </g>
      <g>
        <ellipse cx="1080" cy="350" rx="152" ry="42" fill="#ffffff" stroke="#1c5240" stroke-width="1.4"/>
        <text x="1080" y="345" text-anchor="middle" class="t-title">浏览课程列表 / 详情</text>
        <text x="1080" y="364" text-anchor="middle" class="t-small">分类 · 排序 · 完整大纲</text>
      </g>
      <g>
        <ellipse cx="1080" cy="520" rx="152" ry="38" fill="#ffffff" stroke="#1c5240" stroke-width="1.4"/>
        <text x="1080" y="515" text-anchor="middle" class="t-title">注册账号</text>
        <text x="1080" y="534" text-anchor="middle" class="t-small">昵称 · 手机号 · 密码</text>
      </g>
      <g>
        <ellipse cx="1080" cy="630" rx="152" ry="38" fill="#ffffff" stroke="#1c5240" stroke-width="1.4"/>
        <text x="1080" y="625" text-anchor="middle" class="t-title">登录 / 退出</text>
        <text x="1080" y="644" text-anchor="middle" class="t-small">JWT 令牌</text>
      </g>
    </g>

  </svg>

  <div class="legend">
    <span>实线箭头 = 参与者与用例的关联</span>
    <span>学员具备访客的全部浏览能力，图中两条连线指向同一用例即为共用</span>
    <span>«include» = 发布课程包含大纲管理与图片上传两个子用例</span>
  </div>
</div>
</body>
</html>
